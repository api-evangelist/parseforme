method: searched
source: https://parseforme.com/developers
format: custom-envelope
envelope: >-
  Every error, on every endpoint, is the same JSON envelope: { "error": { "code", "message", "requestId" } }.
  Branch on code, show message to a human, quote requestId to support (also returned as the X-Request-Id
  header on every response). Not RFC 9457 problem+json.
problems:
  - status: 400
    code: INVALID_SOURCE
    title: Neither a file part nor a sourceUrl - or both. Send exactly one.
    source_operation: openapi/parseforme-openapi-original.json#V1DocumentsController_create
  - status: 400
    code: INVALID_IDEMPOTENCY_KEY
    title: 'The Idempotency-Key header does not match ^[A-Za-z0-9_\-:.]{1,128}$.'
    source_operation: openapi/parseforme-openapi-original.json#V1DocumentsController_create
  - status: 400
    code: SOURCE_URL_REJECTED
    title: >-
      The egress guard refused the sourceUrl before connecting - not https, not port 443, or it resolved
      to a private or link-local address (BLOCKED_ADDRESS). The URL is never echoed back.
  - status: 400
    code: SOURCE_FETCH_FAILED
    title: The sourceUrl was allowed but could not be fetched. Upstream status reported, body never.
  - status: 400
    code: EMPTY_FILE
    title: The uploaded part carried no bytes.
  - status: 400
    code: VALIDATION_ERROR
    title: >-
      A JSON body failed validation; the message names the fields. On POST /v1/webhooks this includes a
      reserved authHeader name (host, content-type, content-length, transfer-encoding, connection, x-parseforme-*).
  - status: 400
    code: WEBHOOK_URL_REJECTED
    title: >-
      The webhook URL failed the egress policy (https on 443, no credentials, public hostname, no IP
      literal). The policy re-runs at every delivery and on every /test.
  - status: 400
    code: WEBHOOKS_DISABLED
    title: Outbound webhooks are not configured on the answering server.
  - status: 400
    code: QBO_NEEDS_TEMPLATE
    title: format=qbo requires a templateId on the export.
    source_operation: openapi/parseforme-openapi-original.json#V1DocumentsController_exportOne
  - status: 401
    code: null
    title: >-
      Missing, malformed, unknown or revoked key - always the same opaque 401, deliberately, so
      authentication failures are not a probing oracle.
  - status: 402
    code: INSUFFICIENT_BALANCE
    title: The workspace has no tokens left. Top up and retry.
  - status: 404
    code: WEBHOOK_NOT_FOUND
    title: No endpoint with that id in this workspace. Another workspace's id is a 404 too, never a 403.
  - status: 409
    code: WEBHOOK_LIMIT
    title: Ten endpoints already registered in this workspace. Delete one first.
  - status: 409
    code: WEBHOOK_URL_EXISTS
    title: That URL is already registered in this workspace.
  - status: 413
    code: UPLOAD_TOO_LARGE
    title: The declared body is over 20 MB. Under-declared bodies are cut off and answer PAYLOAD_TOO_LARGE.
  - status: 413
    code: SOURCE_TOO_LARGE
    title: The file behind a sourceUrl is over 20 MB.
  - status: 415
    code: UNSUPPORTED_TYPE
    title: The uploaded bytes are not PDF, DOCX, PNG, JPEG, TIFF or WebP (type read from bytes, not Content-Type).
  - status: 415
    code: SOURCE_UNSUPPORTED_TYPE
    title: The bytes behind a sourceUrl are not a supported type.
  - status: 429
    code: RATE_LIMITED
    title: A per-minute limit was hit. Honour Retry-After.
  - status: 429
    code: API_KEY_DAILY_CAP
    title: The 500 document creations/day cap. Retry-After is capped at an hour.
  - status: 503
    code: UPLOAD_BUSY
    title: 'Too many uploads in flight. Retry after the Retry-After: 5 it sends.'
